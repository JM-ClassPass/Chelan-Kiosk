<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Roster - Chelan High</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-chelan { background-color: #0d5235; }
        .text-chelan { color: #0d5235; }
        .border-chelan { border-color: #0d5235; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-chelan text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" alt="Logo" class="h-10">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold tracking-wide">Chelan High</h1>
                <span class="bg-green-800/80 text-green-200 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-green-700/50">Roster Manager</span>
            </div>
        </div>
        <div class="flex gap-2">
            <a href="teacher.html" class="bg-white text-chelan font-bold text-xs px-3.5 py-2 rounded-lg shadow">Live Dashboard</a>
            <a href="index.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all border border-green-700/60 flex items-center">Kiosk View</a>
        </div>
    </header>

    <div class="max-w-5xl w-full mx-auto p-4 lg:p-6 flex-grow flex flex-col gap-6">
        
        <!-- Add Student Form -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span>➕</span> Add Student to Roster
            </h2>
            <form id="roster-add-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input type="text" id="roster-id" placeholder="Student ID / Barcode" required class="text-xs px-3 py-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none focus:border-chelan">
                <input type="text" id="roster-fname" placeholder="First Name" required class="text-xs px-3 py-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none focus:border-chelan">
                <input type="text" id="roster-lname" placeholder="Last Name" required class="text-xs px-3 py-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none focus:border-chelan">
                <button type="submit" id="roster-submit-btn" class="sm:col-span-3 bg-chelan hover:bg-green-800 text-white font-bold text-xs py-2 rounded-lg transition">+ Save Student</button>
            </form>
        </div>

        <!-- Roster Table -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2"><span>👥</span> Class Roster</h2>
                    <span id="roster-count" class="text-xs text-slate-400 bg-white px-2 py-1 rounded border border-slate-200 font-mono">0</span>
                </div>
                <input type="text" id="roster-search" oninput="renderRoster()" placeholder="🔍 Search roster..." class="text-xs border border-slate-200 rounded-full px-4 py-1.5 bg-white focus:outline-none focus:border-chelan">
            </div>

            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs">
                        <tr>
                            <th class="px-6 py-3">Student ID</th>
                            <th class="px-6 py-3">First Name</th>
                            <th class="px-6 py-3">Last Name</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roster-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="px-6 py-4 text-center text-slate-400 text-xs italic">Loading roster...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOqjLMzMydaR31WWUA35sr1FrNLfHPxuI",
            authDomain: "chelan-classroom-pass-a811e.firebaseapp.com",
            databaseURL: "https://chelan-classroom-pass-a811e-default-rtdb.firebaseio.com",
            projectId: "chelan-classroom-pass-a811e",
            storageBucket: "chelan-classroom-pass-a811e.firebasestorage.app",
            messagingSenderId: "645480807479",
            appId: "1:645480807479:web:d280d4ef38e8754a9953b2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let rosterData = {};

        onValue(ref(db, 'classroom_roster'), s => {
            rosterData = s.val() || {};
            renderRoster();
        });

        const form = document.getElementById('roster-add-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('roster-submit-btn');
            const id = document.getElementById('roster-id').value.trim();
            const fname = document.getElementById('roster-fname').value.trim();
            const lname = document.getElementById('roster-lname').value.trim();

            if (!id || !fname || !lname) return;

            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                await set(ref(db, `classroom_roster/${id}`), { firstName: fname, lastName: lname });
                form.reset();
                btn.textContent = "+ Save Student";
                btn.disabled = false;
            } catch (err) {
                alert("Error saving: " + err.message);
                btn.disabled = false;
            }
        });

        window.renderRoster = () => {
            const keys = Object.keys(rosterData);
            document.getElementById('roster-count').textContent = keys.length;

            const search = document.getElementById('roster-search').value.toLowerCase().trim();
            const filteredKeys = keys.filter(k => {
                const s = rosterData[k];
                const matchId = k.toLowerCase().includes(search);
                const matchFname = (s.firstName || '').toLowerCase().includes(search);
                const matchLname = (s.lastName || '').toLowerCase().includes(search);
                return matchId || matchFname || matchLname;
            });

            if (filteredKeys.length === 0) {
                document.getElementById('roster-table-body').innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-slate-400 text-xs italic">No roster entries found.</td></tr>';
                return;
            }

            document.getElementById('roster-table-body').innerHTML = filteredKeys.map(k => {
                const s = rosterData[k];
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-3 font-mono font-bold text-xs text-slate-700">${k}</td>
                        <td class="px-6 py-3 font-semibold text-slate-800">${s.firstName || ''}</td>
                        <td class="px-6 py-3 font-semibold text-slate-800">${s.lastName || ''}</td>
                        <td class="px-6 py-3 text-right">
                            <button onclick="deleteStudent('${k}')" class="text-red-600 hover:text-red-800 font-bold text-xs px-2 py-1 bg-red-50 hover:bg-red-100 rounded transition">Remove</button>
                        </td>
                    </tr>
                `;
            }).join('');
        };

        window.deleteStudent = async (id) => {
            if (!confirm(`Are you sure you want to remove student ID ${id}?`)) return;
            try {
                await remove(ref(db, `classroom_roster/${id}`));
            } catch (err) {
                console.error("Delete error:", err);
            }
        };
    </script>
</body>
</html>
