<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Roster - Chelan High</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-chelan { background-color: #0d5235; }
        .text-chelan { color: #0d5235; }
        .border-chelan { border-color: #0d5235; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-chelan text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" alt="Logo" class="h-10">
            <h1 class="text-xl font-bold tracking-wide">Chelan High</h1>
            <span class="bg-green-800/60 text-green-100 text-[10px] px-2 py-1 rounded-full border border-green-700/50 uppercase tracking-wide font-mono">Roster v1.003</span>
        </div>
        <div class="flex gap-2">
            <a href="teacher.html" class="bg-green-800 hover:bg-green-700 text-white font-bold text-sm px-4 py-2 rounded-lg border border-green-700 transition">Back to Dashboard</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-[1000px] w-full mx-auto p-4 lg:p-6 flex flex-col gap-6">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-grow flex flex-col">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span>👥</span> Class Roster
                </h2>
                <span id="roster-count" class="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1 rounded-full">0 Students</span>
            </div>
            
            <div class="overflow-auto custom-scrollbar flex-grow p-0">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-100 text-slate-600 font-semibold sticky top-0 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-3">Student ID</th>
                            <th class="px-6 py-3">Last Name</th>
                            <th class="px-6 py-3">First Name</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roster-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="px-6 py-4 text-slate-400 text-center italic">Loading roster...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        // Updated exact config
        const firebaseConfig = {
            apiKey: "AIzaSyDOqjLMzMydaR31WWUA35sr1FrNLfHPxuI",
            authDomain: "chelan-classroom-pass-a811e.firebaseapp.com",
            databaseURL: "https://chelan-classroom-pass-a811e-default-rtdb.firebaseio.com",
            projectId: "chelan-classroom-pass-a811e",
            storageBucket: "chelan-classroom-pass-a811e.firebasestorage.app",
            messagingSenderId: "645480807479",
            appId: "1:645480807479:web:d280d4ef38e8754a9953b2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const rosterRef = ref(db, 'classroom_roster');

        onValue(rosterRef, (snapshot) => {
            const data = snapshot.val() || {};
            const tbody = document.getElementById('roster-table-body');
            const countSpan = document.getElementById('roster-count');
            
            const studentIds = Object.keys(data);
            countSpan.textContent = `${studentIds.length} Student${studentIds.length !== 1 ? 's' : ''}`;

            if (studentIds.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-slate-400 text-center italic">No students found in the roster. Add them from the dashboard!</td></tr>';
                return;
            }

            // Sort alphabetically by Last Name
            studentIds.sort((a, b) => {
                const nameA = (data[a].lastName || '').toLowerCase();
                const nameB = (data[b].lastName || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });

            tbody.innerHTML = studentIds.map(id => {
                const student = data[id];
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-3 font-mono text-xs text-slate-500">${id}</td>
                        <td class="px-6 py-3 font-bold text-slate-800">${student.lastName || '--'}</td>
                        <td class="px-6 py-3 text-slate-700">${student.firstName || '--'}</td>
                        <td class="px-6 py-3 text-right">
                            <button onclick="deleteStudent('${id}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1 rounded text-xs font-bold transition">Remove</button>
                        </td>
                    </tr>
                `;
            }).join('');
        });

        window.deleteStudent = (id) => {
            if (confirm(`Are you sure you want to remove student ID: ${id}?`)) {
                remove(ref(db, `classroom_roster/${id}`))
                    .catch(err => alert("Error removing student: " + err.message));
            }
        };
    </script>
</body>
</html>
