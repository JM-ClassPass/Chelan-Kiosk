<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Roster - Chelan High</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-chelan { background-color: #0d5235; }
        .text-chelan { color: #0d5235; }
        .border-chelan { border-color: #0d5235; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Device Lock Screen -->
    <div id="device-lock-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl space-y-6">
            <div class="text-6xl mb-2">🔒</div>
            <div>
                <h2 class="text-2xl font-black">Roster Locked</h2>
            </div>
            <form onsubmit="handlePinSubmit(event)" class="space-y-4">
                <input type="password" id="pin-input" maxlength="6" placeholder="PIN" autofocus required
                    class="w-full text-center font-mono text-3xl tracking-widest px-4 py-3 bg-slate-900 border-2 border-slate-600 rounded-2xl focus:outline-none text-white">
                <button type="submit" class="w-full py-3.5 bg-chelan hover:bg-green-800 text-white font-bold rounded-2xl">Unlock</button>
            </form>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="bg-chelan text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" alt="Logo" class="h-10">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold tracking-wide">Chelan High</h1>
                <span class="bg-green-800/80 text-green-200 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-green-700/50">Teacher Dashboard v1.004</span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <span id="live-clock" class="text-lg font-mono font-bold block leading-none">--:--:-- --</span>
                <span class="text-[10px] text-green-300 uppercase tracking-widest font-bold">MEDICAL SCIENCES</span>
            </div>
            <div class="flex gap-2">
                <a href="teacher.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all border border-green-700/60 flex items-center">Live Dashboard</a>
                <a href="roster.html" class="bg-white text-chelan font-bold text-sm px-4 py-2 rounded-lg shadow">Manage Roster</a>
                <a href="index.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all border border-green-700/60 flex items-center">Kiosk View</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-[1200px] w-full mx-auto p-4 lg:p-6 flex flex-col gap-6">
        
        <!-- Action Bar & Add Student Form -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">👥 Classroom Roster</h2>
                <p class="text-xs text-slate-500 mt-1">Add, update, or remove student accounts from the system.</p>
            </div>

            <!-- Add Student Form -->
            <form id="add-roster-form" class="flex flex-wrap sm:flex-nowrap gap-2 w-full md:w-auto">
                <input type="text" id="add-id" placeholder="ID / Barcode" required class="text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-chelan w-full sm:w-28">
                <input type="text" id="add-fname" placeholder="First Name" required class="text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-chelan w-full sm:w-32">
                <input type="text" id="add-lname" placeholder="Last Name" required class="text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-chelan w-full sm:w-32">
                <button type="submit" id="add-roster-btn" class="bg-chelan hover:bg-green-800 text-white text-xs font-bold px-4 py-2 rounded-lg transition whitespace-nowrap">+ Add Student</button>
            </form>
        </div>

        <!-- Roster Table Container -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-grow flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <span id="roster-count" class="text-xs font-bold text-slate-500">0 Total Students</span>
                <input type="text" id="search-roster" oninput="filterRoster()" placeholder="🔍 Search roster..." class="text-xs border border-slate-200 rounded-full px-3 py-1.5 w-60 bg-white focus:outline-none">
            </div>

            <div class="overflow-auto custom-scrollbar flex-grow">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-100/70 text-slate-600 font-semibold sticky top-0 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-3">Student ID</th>
                            <th class="px-6 py-3">First Name</th>
                            <th class="px-6 py-3">Last Name</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roster-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="px-6 py-4 text-center text-slate-400 text-xs italic">Loading roster data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Lock Screen & Navigation Logic -->
    <script>
        const TEACHER_PIN = "486200";
        if (localStorage.getItem('chelan_teacher_authorized') === 'true') {
            document.getElementById('device-lock-screen').classList.add('hidden');
        }
        function handlePinSubmit(e) {
            e.preventDefault();
            if (document.getElementById('pin-input').value === TEACHER_PIN) {
                localStorage.setItem('chelan_teacher_authorized', 'true');
                document.getElementById('device-lock-screen').classList.add('hidden');
            }
        }
        setInterval(() => {
            const clock = document.getElementById('live-clock');
            if(clock) clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }, 1000);
    </script>

    <!-- Firebase Realtime Data Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDOqjLMzMydaR31WWUA35sr1FrNLfHPxuI",
            authDomain: "chelan-classroom-pass-a811e.firebaseapp.com",
            databaseURL: "https://chelan-classroom-pass-a811e-default-rtdb.firebaseio.com",
            projectId: "chelan-classroom-pass-a811e",
            storageBucket: "chelan-classroom-pass-a811e.firebasestorage.app",
            messagingSenderId: "645480807479",
            appId: "1:645480807479:web:d280d4ef38e8754a9953b2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let rosterData = {};

        // Load Roster from Firebase
        onValue(ref(db, 'classroom_roster'), snapshot => {
            rosterData = snapshot.val() || {};
            renderRoster();
        });

        // Add Student Handler
        document.getElementById('add-roster-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('add-id').value.trim();
            const firstName = document.getElementById('add-fname').value.trim();
            const lastName = document.getElementById('add-lname').value.trim();

            if (!id || !firstName || !lastName) return;

            set(ref(db, 'classroom_roster/' + id), {
                firstName: firstName,
                lastName: lastName
            }).then(() => {
                document.getElementById('add-roster-form').reset();
            });
        });

        window.filterRoster = () => renderRoster();

        function renderRoster() {
            const search = document.getElementById('search-roster').value.toLowerCase();
            const tbody = document.getElementById('roster-table-body');
            const keys = Object.keys(rosterData);

            const filteredKeys = keys.filter(id => {
                const s = rosterData[id];
                const full = `${s.firstName || ''} ${s.lastName || ''} ${id}`.toLowerCase();
                return full.includes(search);
            });

            document.getElementById('roster-count').textContent = `${filteredKeys.length} Student${filteredKeys.length === 1 ? '' : 's'}`;

            if (filteredKeys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-slate-400 text-xs italic">No matching students found.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredKeys.map(id => {
                const s = rosterData[id];
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-3 font-mono text-xs text-slate-600">${id}</td>
                        <td class="px-6 py-3 font-medium text-slate-800">${s.firstName || '--'}</td>
                        <td class="px-6 py-3 font-medium text-slate-800">${s.lastName || '--'}</td>
                        <td class="px-6 py-3 text-right">
                            <button onclick="deleteStudent('${id}')" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-2.5 py-1 rounded font-bold transition">Remove</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.deleteStudent = (id) => {
            if (confirm(`Are you sure you want to remove student ID ${id} from the roster?`)) {
                remove(ref(db, 'classroom_roster/' + id));
            }
        };
    </script>
</body>
</html>
