<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chelan High - Student Kiosk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans overflow-x-hidden select-none">

  <!-- Header Navigation Bar -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 shadow-sm flex justify-between items-center sticky top-0 z-30">
    <!-- Official Chelan High Logo & Room Info -->
    <div class="flex items-center gap-4">
      <img 
        src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" 
        alt="Chelan High School" 
        class="h-10 w-auto object-contain"
      />
      <div class="border-l border-slate-200 pl-4 hidden sm:block">
        <h1 class="text-base font-bold text-slate-900 leading-tight">Student Pass & Phone Kiosk</h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="kiosk-version" class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-300">v1.1.10</span>
          <span id="kiosk-room" class="text-xs text-slate-500 font-semibold">ROOM 176</span>
        </div>
      </div>
    </div>

    <!-- Live Clock & Teacher Access Button -->
    <div class="flex items-center gap-4">
      <div class="text-right">
        <div id="kiosk-clock" class="text-xl font-mono font-extrabold text-emerald-600">00:00:00 AM</div>
        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Kiosk Active</div>
      </div>
      <!-- Teacher Portal Shortcut -->
      <a href="teacher.html" class="p-2.5 rounded-xl bg-slate-100 text-slate-600 hover:text-slate-900 hover:bg-slate-200 transition border border-slate-200" title="Teacher Access">
        <i class="fa-solid fa-lock text-sm"></i>
      </a>
    </div>
  </header>

  <!-- Main Kiosk Workspace (Side-by-Side Layout) -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <!-- LEFT PANEL: Action Tabs, Student ID Display & Keypad (5 Cols) -->
    <section class="lg:col-span-5 bg-white border border-slate-200 rounded-3xl p-6 shadow-lg flex flex-col gap-5">
      
      <!-- 1. Mode Action Tabs -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">1. Select Action</label>
        <div class="grid grid-cols-3 gap-2">
          <button id="tab-phone" class="px-3 py-2.5 rounded-xl font-bold text-xs transition border border-emerald-500 bg-emerald-500 text-white shadow-md flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-mobile-screen"></i> Phone
          </button>
          <button id="tab-bathroom" class="px-3 py-2.5 rounded-xl font-bold text-xs transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-restroom"></i> Bathroom
          </button>
          <button id="tab-hall" class="px-3 py-2.5 rounded-xl font-bold text-xs transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-id-badge"></i> Hall Pass
          </button>
        </div>
      </div>

      <!-- 2. Student ID Input Display Box -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">2. Scan or Enter Student ID</label>
          <button id="toggle-mask-btn" class="text-xs text-slate-400 hover:text-slate-600 transition" title="Toggle ID Masking">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <div class="bg-slate-50 border-2 border-slate-300 rounded-2xl p-4 text-center shadow-inner flex items-center justify-center min-h-[64px]">
          <span id="id-display" class="text-2xl font-mono tracking-widest text-slate-400 select-none">• • • • • •</span>
        </div>
      </div>

      <!-- 3. Keypad Number Buttons -->
      <div class="grid grid-cols-3 gap-3">
        <button id="btn-1" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">1</button>
        <button id="btn-2" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">2</button>
        <button id="btn-3" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">3</button>

        <button id="btn-4" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">4</button>
        <button id="btn-5" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">5</button>
        <button id="btn-6" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">6</button>

        <button id="btn-7" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">7</button>
        <button id="btn-8" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">8</button>
        <button id="btn-9" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">9</button>

        <button id="btn-clear" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-sm font-bold py-3.5 rounded-2xl border border-rose-200 shadow-sm active:scale-95 transition">Clear</button>
        <button id="btn-0" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-2xl font-bold py-3.5 rounded-2xl border border-slate-200 shadow-sm active:scale-95 transition">0</button>
        <button id="btn-submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-extrabold py-3.5 rounded-2xl shadow-md active:scale-95 transition flex items-center justify-center gap-1">
          Submit <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>

    </section>

    <!-- RIGHT PANEL: Pocket Selector Grid (7 Cols) -->
    <section class="lg:col-span-7 bg-white border border-slate-200 rounded-3xl p-6 shadow-lg flex flex-col">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-border-all text-emerald-600"></i> Phone Pocket Grid (1–36)
          </h2>
          <p class="text-xs text-slate-500">Tap an open pocket to select it for phone check-in.</p>
        </div>
        <div class="flex items-center gap-3 text-xs font-semibold">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Open</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-300 inline-block"></span> In Use</span>
        </div>
      </div>

      <!-- Pocket Grid Container (Rendered by app.js) -->
      <div id="pocket-grid" class="grid grid-cols-6 gap-2.5 sm:gap-3 flex-1">
        <!-- Buttons 1-36 render here -->
      </div>
    </section>

  </main>

  <!-- Toast Notification Overlay -->
  <div id="kiosk-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm border border-white/20 backdrop-blur-md transition-all duration-300 z-50 hidden opacity-0"></div>

  <footer class="text-center py-3 text-xs text-slate-400 font-medium">
    Chelan High School Classroom Pass System &bull; Powered by Firebase
  </footer>

  <!-- Script Module Import -->
  <script type="module" src="app.js"></script>
</body>
</html>
