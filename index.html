<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Kiosk - Chelan High</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-chelan { background-color: #0d5235; }
        .text-chelan { color: #0d5235; }
        .border-chelan { border-color: #0d5235; }
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Version -->
    <div class="absolute top-4 left-4 flex items-center gap-3">
        <img src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" alt="Logo" class="h-10">
        <span class="bg-green-800/20 text-green-800 text-[10px] px-2 py-1 rounded-full border border-green-700/30 uppercase tracking-wide font-bold">Kiosk v1.005</span>
    </div>

    <!-- Main Kiosk Container -->
    <div class="max-w-2xl w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center relative overflow-hidden min-h-[400px] flex flex-col justify-center">
        
        <!-- STEP 1: ID Entry -->
        <div id="step-id-entry" class="space-y-6 transition-all duration-300">
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Student Check-In</h1>
            <p class="text-slate-500">Scan your barcode or enter your Student ID.</p>
            
            <form id="id-form" class="max-w-xs mx-auto space-y-4">
                <input type="number" id="student-id-input" placeholder="Enter ID" autofocus autocomplete="off" required
                    class="w-full text-center text-3xl font-bold tracking-widest px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:outline-none focus:border-chelan transition-colors shadow-inner">
                <button type="submit" class="w-full bg-chelan hover:bg-green-800 text-white font-bold py-4 rounded-2xl text-lg shadow-md transition-all">Continue &rarr;</button>
            </form>
            <p id="id-error-msg" class="text-red-500 font-bold h-6 text-sm"></p>
        </div>

        <!-- STEP 2: Unknown ID (Manual Entry) -->
        <div id="step-manual-entry" class="hidden space-y-6 transition-all duration-300">
            <div class="bg-orange-50 text-orange-800 p-4 rounded-xl border border-orange-200 mb-4">
                <p class="font-bold">ID Not Found (Attempt 3/3)</p>
                <p class="text-sm">Please register your name for this session.</p>
            </div>
            <form id="manual-form" class="max-w-sm mx-auto space-y-4">
                <div class="flex gap-3">
                    <input type="text" id="manual-fname" placeholder="First Name" required class="w-1/2 px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-chelan">
                    <input type="text" id="manual-lname" placeholder="Last Name" required class="w-1/2 px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-chelan">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-xl text-lg shadow-md transition-all">Register & Continue</button>
                <button type="button" onclick="resetKiosk()" class="w-full text-slate-500 hover:text-slate-700 text-sm font-bold">Cancel</button>
            </form>
        </div>

        <!-- STEP 3: Action Selection -->
        <div id="step-actions" class="hidden space-y-6 transition-all duration-300">
            <h2 class="text-2xl font-black text-slate-800">Welcome, <span id="display-name" class="text-chelan">Student</span>!</h2>
            <p class="text-slate-500 text-sm pb-2 border-b border-slate-100">What do you need to do?</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto" id="action-buttons">
                <!-- Dynamically populated based on active status -->
            </div>
            
            <button onclick="resetKiosk()" class="mt-6 text-slate-400 hover:text-slate-600 text-sm font-bold underline">Cancel / Go Back</button>
        </div>

        <!-- STEP 4: Phone Pocket Selection -->
        <div id="step-phone-slot" class="hidden space-y-4 transition-all duration-300 flex flex-col h-full justify-between">
            <div>
                <h2 class="text-xl font-black text-slate-800">Select a Phone Slot</h2>
                <p class="text-slate-500 text-sm mb-4">Choose an available pocket for your device.</p>
                <div id="slot-grid" class="grid grid-cols-6 gap-2 max-w-md mx-auto mb-4">
                    <!-- Populated via JS -->
                </div>
            </div>
            <div class="flex gap-3 max-w-md mx-auto w-full pt-4 border-t border-slate-100">
                <button onclick="showStep('actions')" class="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition-all">Back</button>
                <button id="confirm-phone-btn" class="w-2/3 bg-chelan hover:bg-green-800 text-white font-bold py-3 rounded-xl shadow-md transition-all">Check In Phone</button>
            </div>
        </div>

        <!-- Success Screen -->
        <div id="step-success" class="hidden flex flex-col items-center justify-center space-y-4 py-8">
            <div class="text-6xl mb-2">✅</div>
            <h2 class="text-3xl font-black text-green-700">Success!</h2>
            <p id="success-msg" class="text-slate-600 text-lg">Action recorded.</p>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDOqjLMzMydaR31WWUA35sr1FrNLfHPxuI",
            authDomain: "chelan-classroom-pass-a811e.firebaseapp.com",
            databaseURL: "https://chelan-classroom-pass-a811e-default-rtdb.firebaseio.com",
            projectId: "chelan-classroom-pass-a811e",
            storageBucket: "chelan-classroom-pass-a811e.firebasestorage.app",
            messagingSenderId: "645480807479",
            appId: "1:645480807479:web:d280d4ef38e8754a9953b2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Data
        let roster = {};
        let activePhones = {};
        let activeBathroom = {};
        let activeHall = {};
        
        let currentStudentId = null;
        let currentStudentName = "";
        let failedAttempts = 0;
        let selectedSlot = null;

        // DB Listeners
        onValue(ref(db, 'classroom_roster'), s => roster = s.val() || {});
        onValue(ref(db, 'active_phones_in_class'), s => activePhones = s.val() || {});
        onValue(ref(db, 'active_bathroom_passes'), s => activeBathroom = s.val() || {});
        onValue(ref(db, 'active_hall_passes'), s => activeHall = s.val() || {});

        // Utility: Logging
        function logSystemAction(actionStr) {
            push(ref(db, 'system_logs'), {
                studentId: currentStudentId,
                name: currentStudentName,
                action: actionStr,
                timestamp: Date.now()
            });
        }

        // Navigation
        window.showStep = (step) => {
            ['id-entry', 'manual-entry', 'actions', 'phone-slot', 'success'].forEach(s => {
                document.getElementById(`step-${s}`).classList.add('hidden');
            });
            document.getElementById(`step-${step}`).classList.remove('hidden');
            if (step === 'id-entry') document.getElementById('student-id-input').focus();
        };

        window.resetKiosk = () => {
            currentStudentId = null;
            currentStudentName = "";
            failedAttempts = 0;
            document.getElementById('id-form').reset();
            document.getElementById('manual-form').reset();
            document.getElementById('id-error-msg').textContent = "";
            showStep('id-entry');
        };

        // Step 1: ID Submission Logic
        document.getElementById('id-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('student-id-input').value.trim();
            const errorMsg = document.getElementById('id-error-msg');
            
            if (roster[id]) {
                // Found Student
                currentStudentId = id;
                currentStudentName = `${roster[id].firstName} ${roster[id].lastName}`;
                failedAttempts = 0;
                errorMsg.textContent = "";
                prepareActionScreen();
            } else {
                // Not Found - 3 strikes logic
                failedAttempts++;
                if (failedAttempts >= 3) {
                    currentStudentId = id; // Keep the typed ID
                    showStep('manual-entry');
                    document.getElementById('manual-fname').focus();
                } else {
                    errorMsg.textContent = `ID not found. Please try again. (${failedAttempts}/3 attempts)`;
                    document.getElementById('student-id-input').value = "";
                }
            }
        });

        // Step 2: Manual Registration Submission
        document.getElementById('manual-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const fname = document.getElementById('manual-fname').value.trim();
            const lname = document.getElementById('manual-lname').value.trim();
            
            // Temporarily add to roster for this session (Teacher can see/approve later)
            set(ref(db, `classroom_roster/${currentStudentId}`), { firstName: fname, lastName: lname });
            
            currentStudentName = `${fname} ${lname}`;
            prepareActionScreen();
        });

        // Step 3: Prepare Actions based on status
        function prepareActionScreen() {
            document.getElementById('display-name').textContent = currentStudentName;
            const container = document.getElementById('action-buttons');
            container.innerHTML = ""; // Clear existing

            const hasPhone = !!activePhones[currentStudentId];
            const hasBath = !!activeBathroom[currentStudentId];
            const hasHall = !!activeHall[currentStudentId];

            if (hasPhone) {
                container.innerHTML += `<button onclick="handlePhoneCheckout()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow border-b-4 border-slate-950 flex flex-col items-center justify-center gap-1 transition">
                    <span class="text-2xl">📱</span><span>Check OUT Phone</span>
                </button>`;
            } else {
                container.innerHTML += `<button onclick="preparePhoneCheckin()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow border-b-4 border-green-800 flex flex-col items-center justify-center gap-1 transition">
                    <span class="text-2xl">📱</span><span>Check IN Phone</span>
                </button>`;
            }

            if (hasBath) {
                container.innerHTML += `<button onclick="handleReturn('bathroom')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow border-b-4 border-red-800 flex flex-col items-center justify-center gap-1 transition">
                    <span class="text-2xl">🚻</span><span>Return from Bathroom</span>
                </button>`;
            } else {
                container.innerHTML += `<button onclick="handlePass('bathroom')" class="bg-red-100 hover:bg-red-200 text-red-800 font-bold py-4 rounded-xl shadow border-b-4 border-red-300 flex flex-col items-center justify-center gap-1 transition">
                    <span class="text-2xl">🚻</span><span>Bathroom Pass</span>
                </button>`;
            }

            if (hasHall) {
                container.innerHTML += `<button onclick="handleReturn('hall')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow border-b-4 border-indigo-800 flex flex-col items-center justify-center gap-1 transition">
                    <span class="text-2xl">🎟️</span><span>Return from Hall</span>
                </button>`;
            } else {
                container.innerHTML += `<button onclick="handlePass('hall')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold py-4 rounded-xl shadow border-b-4 border-indigo-300 flex flex-col items-center justify-center gap-1 transition">
                    <span class="text-2xl">🎟️</span><span>Hall Pass</span>
                </button>`;
            }

            showStep('actions');
        }

        // Action Handlers
        window.handlePhoneCheckout = () => {
            // Requirement: If a phone is checked out, all hall passes and bathroom passes for that student close out.
            remove(ref(db, `active_phones_in_class/${currentStudentId}`));
            remove(ref(db, `active_bathroom_passes/${currentStudentId}`));
            remove(ref(db, `active_hall_passes/${currentStudentId}`));
            
            logSystemAction("Phone Checkout (Passes auto-cleared)");
            showSuccess("Phone checked out successfully.");
        };

        window.handlePass = (type) => {
            set(ref(db, `active_${type}_passes/${currentStudentId}`), {
                studentName: currentStudentName,
                timestamp: Date.now()
            });
            logSystemAction(`${type === 'bathroom' ? 'Bathroom' : 'Hall'} Pass Assigned`);
            showSuccess(`${type === 'bathroom' ? 'Bathroom' : 'Hall'} pass assigned.`);
        };

        window.handleReturn = (type) => {
            remove(ref(db, `active_${type}_passes/${currentStudentId}`));
            logSystemAction(`${type === 'bathroom' ? 'Bathroom' : 'Hall'} Pass Returned`);
            showSuccess(`Welcome back!`);
        };

        // Phone Check-In Slot Logic
        window.preparePhoneCheckin = () => {
            const usedSlots = Object.values(activePhones).map(p => parseInt(p.pocket));
            
            // Requirement: Auto choose lowest available slot
            let lowestAvailable = 1;
            for (let i = 1; i <= 36; i++) {
                if (!usedSlots.includes(i)) {
                    lowestAvailable = i;
                    break;
                }
            }
            selectedSlot = lowestAvailable;

            const grid = document.getElementById('slot-grid');
            grid.innerHTML = "";
            
            for (let i = 1; i <= 36; i++) {
                const isUsed = usedSlots.includes(i);
                const isSelected = i === selectedSlot && !isUsed;
                
                // Requirement: Gray out used slots, remove # symbol
                const btn = document.createElement('button');
                btn.textContent = i; // Just the number
                btn.className = `py-2 rounded-lg font-bold text-sm transition-all shadow-sm ${
                    isUsed ? 'bg-slate-200 text-slate-400 cursor-not-allowed border border-slate-300' :
                    isSelected ? 'bg-chelan text-white ring-2 ring-green-400 ring-offset-2' :
                    'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'
                }`;
                
                if (!isUsed) {
                    btn.onclick = () => {
                        selectedSlot = i;
                        preparePhoneCheckin(); // Re-render to show selection
                    };
                }
                grid.appendChild(btn);
            }
            showStep('phone-slot');
        };

        // Final Confirm Phone Check-In
        document.getElementById('confirm-phone-btn').addEventListener('click', () => {
            // Double check it wasn't taken in the last split second
            const usedSlots = Object.values(activePhones).map(p => parseInt(p.pocket));
            if (usedSlots.includes(selectedSlot)) {
                alert("That slot was just taken! Please select another.");
                preparePhoneCheckin();
                return;
            }

            set(ref(db, `active_phones_in_class/${currentStudentId}`), {
                studentName: currentStudentName,
                pocket: selectedSlot,
                timestamp: Date.now()
            });
            logSystemAction(`Phone Check-In (Slot ${selectedSlot})`);
            showSuccess(`Phone assigned to slot ${selectedSlot}.`);
        });

        function showSuccess(msg) {
            document.getElementById('success-msg').textContent = msg;
            showStep('success');
            setTimeout(resetKiosk, 2500); // Auto reset after 2.5 seconds
        }
    </script>
</body>
</html>
