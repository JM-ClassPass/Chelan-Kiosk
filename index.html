<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Kiosk - Chelan High</title>
    <!-- Prevent favicon 404 console warning -->
    <link rel="shortcut icon" href="#">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-chelan { background-color: #0d5235; }
        .text-chelan { color: #0d5235; }
        .border-chelan { border-color: #0d5235; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-chelan text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" alt="Logo" class="h-10">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold tracking-wide leading-tight">Chelan High</h1>
                <span id="app-version-tag" class="bg-green-800/80 text-green-200 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-green-700/50">v1.1.01</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right hidden md:block">
                <span id="live-clock" class="text-lg font-mono font-bold block leading-none">--:--:-- --</span>
                <span id="app-dept-tag" class="text-[10px] text-green-300 uppercase tracking-widest font-bold">ROOM 176</span>
            </div>
            <!-- Header Links -->
            <div class="flex gap-2">
                <a href="teacher.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all flex items-center gap-1.5 border border-green-700/60">
                    Live Dashboard
                </a>
                <a href="roster.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all flex items-center gap-1.5 border border-green-700/60">
                    Manage Roster
                </a>
                <a href="index.html" class="bg-white text-chelan text-xs font-bold px-3.5 py-2 rounded-lg shadow-sm transition-all flex items-center gap-1.5">
                    Kiosk View
                </a>
            </div>
        </div>
    </header>

    <!-- Main Kiosk Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8 max-w-lg w-full text-center space-y-6">
            
            <div>
                <h2 class="text-3xl font-black text-slate-800 tracking-tight">Student Check-In / Pass</h2>
                <p class="text-xs font-semibold text-slate-500 mt-1">Scan your barcode or enter your Student ID number below</p>
            </div>

            <!-- ID / Barcode Entry Form -->
            <form id="kiosk-form" class="space-y-5">
                <div class="relative">
                    <input type="text" id="kiosk-id-input" placeholder="Scan Barcode or Type ID..." autofocus autocomplete="off"
                        class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl text-lg font-bold text-center text-slate-800 focus:outline-none focus:border-chelan focus:bg-white transition-all shadow-sm">
                </div>

                <!-- Reason Selector Grid -->
                <div class="grid grid-cols-2 gap-3 text-left">
                    <label class="cursor-pointer">
                        <input type="radio" name="kiosk-reason" value="Restroom Pass" checked class="peer hidden">
                        <div class="p-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl peer-checked:border-chelan peer-checked:bg-emerald-50 text-xs font-bold text-slate-700 peer-checked:text-chelan transition-all text-center flex items-center justify-center gap-2 shadow-sm">
                            <span>🚽</span> Restroom Pass
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="kiosk-reason" value="Office / Nurse" class="peer hidden">
                        <div class="p-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl peer-checked:border-chelan peer-checked:bg-emerald-50 text-xs font-bold text-slate-700 peer-checked:text-chelan transition-all text-center flex items-center justify-center gap-2 shadow-sm">
                            <span>🏥</span> Office / Nurse
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="kiosk-reason" value="Tardy Check-In" class="peer hidden">
                        <div class="p-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl peer-checked:border-chelan peer-checked:bg-emerald-50 text-xs font-bold text-slate-700 peer-checked:text-chelan transition-all text-center flex items-center justify-center gap-2 shadow-sm">
                            <span>⏰</span> Tardy Check-In
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="kiosk-reason" value="Library / Other" class="peer hidden">
                        <div class="p-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl peer-checked:border-chelan peer-checked:bg-emerald-50 text-xs font-bold text-slate-700 peer-checked:text-chelan transition-all text-center flex items-center justify-center gap-2 shadow-sm">
                            <span>📚</span> Library / Other
                        </div>
                    </label>
                </div>

                <button type="submit" class="w-full bg-chelan hover:bg-green-800 text-white font-black py-3.5 rounded-2xl text-base shadow-md hover:shadow-lg transition-all">
                    Submit Check-In
                </button>
            </form>

            <!-- Feedback Alert Display -->
            <div id="kiosk-alert" class="hidden p-4 rounded-xl text-sm font-bold border transition-all"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-xs text-slate-400 font-medium">
        Chelan High School Kiosk System &bull; <span id="footer-room">Room 176</span>
    </footer>

    <!-- Live Clock Script -->
    <script>
        setInterval(() => {
            const clock = document.getElementById('live-clock');
            if(clock) clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }, 1000);
    </script>

    <!-- System Scripts -->
    <script src="config.js?v=1.1.01"></script>
    <script>
        if (window.APP_CONFIG) {
            if (window.APP_CONFIG.version) {
                document.getElementById('app-version-tag').textContent = `v${window.APP_CONFIG.version}`;
            }
            if (window.APP_CONFIG.department) {
                const deptStr = window.APP_CONFIG.department.toUpperCase();
                document.getElementById('app-dept-tag').textContent = deptStr;
                document.getElementById('footer-room').textContent = window.APP_CONFIG.department;
            }
        }
    </script>
    <script src="kiosk.js?v=1.1.01"></script>
</body>
</html>
