<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard - Chelan High School</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons CDN -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
  />
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Dark Forest Green Header Bar -->
  <header class="bg-[#0B4F2C] text-white px-6 py-3 shadow-md flex justify-between items-center z-30">
    <!-- Left: Logo, Title & Version Tag -->
    <div class="flex items-center gap-3">
      <img 
        src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" 
        alt="Chelan High School Logo" 
        class="h-10 w-auto object-contain"
      />
      <div class="flex items-center gap-2">
        <div>
          <h1 class="text-base font-extrabold tracking-wide uppercase leading-none">CHELAN HIGH SCHOOL</h1>
          <p class="text-xs text-emerald-200 font-medium mt-0.5">Teacher Live Pass Dashboard</p>
        </div>
        <span class="bg-emerald-800/80 text-amber-300 text-[10px] font-mono font-bold px-2.5 py-1 rounded-full border border-emerald-600/40 ml-2">
          v1.1.10
        </span>
      </div>
    </div>

    <!-- Center Navigation Tabs -->
    <nav class="hidden md:flex items-center gap-1 bg-[#07381e] p-1.5 rounded-xl border border-emerald-600/30">
      <a href="teacher.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#0B4F2C] text-white shadow-sm border border-emerald-500/30 flex items-center gap-1.5">
        <i class="fa-solid fa-gauge text-emerald-300"></i> Live Dashboard
      </a>
      <a href="roster.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-100 hover:text-white hover:bg-emerald-800/50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-users text-emerald-300"></i> Manage Roster
      </a>
      <a href="index.html" target="_blank" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-100 hover:text-white hover:bg-emerald-800/50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-expand text-emerald-300"></i> Kiosk View <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70"></i>
      </a>
    </nav>

    <!-- Right: Room & Clock -->
    <div class="flex items-center gap-3">
      <div class="text-right pl-3 border-l border-emerald-700/60 flex flex-col justify-center">
        <div id="roster-clock" class="text-base font-mono font-bold tracking-tight">00:00:00 PM</div>
        <div id="roster-room" class="text-[10px] text-emerald-200 font-bold uppercase tracking-wider">TEACHER STATION &bull; ROOM 176</div>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Top Stats Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Currently Out</p>
          <h2 id="stat-active-count" class="text-3xl font-black text-[#0B4F2C] mt-1">0</h2>
        </div>
        <div class="h-12 w-12 rounded-xl bg-emerald-50 flex items-center justify-center text-[#0B4F2C]">
          <i class="fa-solid fa-person-walking-arrow-right text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Today</p>
          <h2 id="stat-total-today" class="text-3xl font-black text-slate-800 mt-1">0</h2>
        </div>
        <div class="h-12 w-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600">
          <i class="fa-solid fa-[#0B4F2C] fa-list-check text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Overtime Passes</p>
          <h2 id="stat-overtime-count" class="text-3xl font-black text-rose-600 mt-1">0</h2>
        </div>
        <div class="h-12 w-12 rounded-xl bg-rose-50 flex items-center justify-center text-rose-600">
          <i class="fa-solid fa-clock-rotate-left text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Roster Total</p>
          <h2 id="stat-roster-count" class="text-3xl font-black text-amber-600 mt-1">0</h2>
        </div>
        <div class="h-12 w-12 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600">
          <i class="fa-solid fa-address-book text-xl"></i>
        </div>
      </div>
    </section>

    <!-- Main Grid: Active Passes & Activity Feed -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Currently Out / Active Hall Passes -->
      <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
          <h2 class="text-sm font-extrabold uppercase tracking-wide text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-person-circle-exclamation text-[#0B4F2C]"></i> Active Hall Passes
          </h2>
          <span class="text-xs font-bold text-slate-400" id="active-passes-subhead">Live monitoring</span>
        </div>

        <div id="active-passes-container" class="p-4 flex-1 min-h-[300px] grid grid-cols-1 sm:grid-cols-2 gap-3 content-start">
          <!-- Active pass cards injected here via JavaScript -->
        </div>
      </div>

      <!-- Live Activity Log -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
          <h2 class="text-sm font-extrabold uppercase tracking-wide text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-clock-history text-emerald-600"></i> Today's Activity Log
          </h2>
          <button id="btn-clear-history" class="text-[11px] font-bold text-rose-600 hover:underline">
            Clear Local
          </button>
        </div>

        <div id="activity-log-container" class="p-4 flex-1 max-h-[500px] overflow-y-auto space-y-2">
          <!-- History log entries injected here -->
        </div>
      </div>

    </section>

  </main>

  <script type="module" src="teacher.js"></script>
</body>
</html>
