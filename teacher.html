<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Chelan High</title>
    <!-- Prevent favicon 404 console warning -->
    <link rel="shortcut icon" href="#">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-chelan { background-color: #0d5235; }
        .text-chelan { color: #0d5235; }
        .border-chelan { border-color: #0d5235; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-chelan text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/396/2025/08/12090756/Logo-Header.png" alt="Logo" class="h-10">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold tracking-wide leading-tight">Chelan High</h1>
                <!-- Dynamic Version Badge -->
                <span id="app-version-tag" class="bg-green-800/80 text-green-200 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-green-700/50">Teacher Dashboard</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right hidden md:block">
                <span id="live-clock" class="text-lg font-mono font-bold block leading-none">--:--:-- --</span>
                <!-- Dynamic Room / Department Subtitle -->
                <span id="app-dept-tag" class="text-[10px] text-green-300 uppercase tracking-widest font-bold">ROOM 176</span>
            </div>
            <!-- Header Links -->
            <div class="flex gap-2">
                <a href="teacher.html" class="bg-white text-chelan text-xs font-bold px-3.5 py-2 rounded-lg shadow-sm transition-all flex items-center gap-1.5">
                    Live Dashboard
                </a>
                <a href="roster.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all flex items-center gap-1.5 border border-green-700/60">
                    Manage Roster
                </a>
                <a href="index.html" class="bg-green-900/60 hover:bg-green-900 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-all flex items-center gap-1.5 border border-green-700/60">
                    Kiosk View
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full space-y-6">
        
        <!-- Summary Stats Banner -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Currently Out on Pass</p>
                    <h3 id="stat-out-count" class="text-3xl font-black text-amber-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl text-2xl">🚶</div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Overdue Passes (>10m)</p>
                    <h3 id="stat-overdue-count" class="text-3xl font-black text-rose-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-rose-50 text-rose-600 rounded-xl text-2xl">🚨</div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Passes Today</p>
                    <h3 id="stat-today-count" class="text-3xl font-black text-chelan mt-1">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-chelan rounded-xl text-2xl">📋</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- LEFT COLUMN: Active Hall Passes (7 Cols) -->
            <div class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-black text-slate-800 flex items-center gap-2">
                        <span>🚨</span> Active Hall Passes
                    </h2>
                    <span class="text-xs font-semibold text-slate-400">Live Updating</span>
                </div>

                <div id="active-passes-list" class="space-y-3 flex-grow overflow-y-auto max-h-[500px] custom-scrollbar pr-1">
                    <!-- Dynamic Active Pass Cards Rendered Here -->
                </div>
            </div>

            <!-- RIGHT COLUMN: Pass History Log (5 Cols) -->
            <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-black text-slate-800 flex items-center gap-2">
                        <span>📜</span> Today's Pass History
                    </h2>
                    <button id="clear-history-btn" class="text-xs font-bold text-slate-400 hover:text-rose-600 transition-colors">
                        Clear Log
                    </button>
                </div>

                <div id="pass-history-list" class="space-y-2 flex-grow overflow-y-auto max-h-[500px] custom-scrollbar pr-1 divide-y divide-slate-100">
                    <!-- Dynamic History Logs Rendered Here -->
                </div>
            </div>

        </div>

    </main>

    <!-- Live Clock Script -->
    <script>
        setInterval(() => {
            const clock = document.getElementById('live-clock');
            if(clock) clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }, 1000);
    </script>

    <!-- Global System Scripts -->
    <script src="config.js?v=1.1.01"></script>
    <script>
        // Dynamically populate version and room/department from config.js
        if (window.APP_CONFIG) {
            if (window.APP_CONFIG.version) {
                const verTag = document.getElementById('app-version-tag');
                if (verTag) verTag.textContent = `Dashboard v${window.APP_CONFIG.version}`;
            }
            if (window.APP_CONFIG.department) {
                const deptTag = document.getElementById('app-dept-tag');
                if (deptTag) deptTag.textContent = window.APP_CONFIG.department.toUpperCase();
            }
        }
    </script>
    <script src="teacher.js?v=1.1.01"></script>
</body>
</html>
