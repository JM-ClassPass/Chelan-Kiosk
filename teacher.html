<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chelan High School - Teacher Station</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans flex flex-col">

  <!-- ==================== HEADER SECTION ==================== -->
  <header class="w-full bg-[#0d4a2b] text-white px-6 py-3 flex items-center justify-between border-b border-[#14532d] shadow-md">
    
    <!-- LEFT: Mascot, Title, Subtitle & Version -->
    <div class="flex items-center space-x-4">
      <img src="assets/goat-logo.png" alt="Chelan Goat Logo" class="h-10 w-auto object-contain" onerror="this.src='https://via.placeholder.com/40?text=Goat'" />

      <div class="flex items-center space-x-3">
        <div class="flex flex-col">
          <h1 class="text-lg font-black tracking-wide text-white uppercase leading-none">
            Chelan High School
          </h1>
          <span class="text-xs font-semibold text-[#86efac] mt-1">
            Student Roster Management
          </span>
        </div>

        <!-- Version Badge -->
        <span class="bg-[#082a18] border border-[#166534] text-[#fef08a] text-xs font-bold px-3 py-1 rounded-full shadow-inner">
          v1.1.10
        </span>
      </div>
    </div>

    <!-- CENTER: Navigation Controls -->
    <nav class="bg-[#082a18] p-1.5 rounded-2xl flex items-center space-x-1.5 border border-[#166534]/60">
      
      <!-- 1. Live Dashboard (ACTIVE) -->
      <button id="nav-dashboard" 
              class="nav-tab flex items-center space-x-2 px-4 py-1.5 rounded-xl border border-[#22c55e] bg-[#14532d]/50 text-white font-bold text-sm shadow-sm transition-all duration-150">
        <svg class="w-4 h-4 text-[#86efac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span>Live Dashboard</span>
      </button>

      <!-- 2. Manage Roster (INACTIVE) -->
      <button id="nav-roster" 
              class="nav-tab flex items-center space-x-2 px-4 py-1.5 rounded-xl text-gray-200 hover:text-white font-semibold text-sm transition-all duration-150">
        <svg class="w-4 h-4 text-[#86efac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <span>Manage Roster</span>
      </button>

      <!-- 3. Kiosk View (FIXED URL) -->
      <a href="https://morinjn.github.io/Chelan-Kiosk/index.html" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="flex items-center space-x-2 px-4 py-1.5 rounded-xl text-gray-200 hover:text-white font-semibold text-sm transition-all duration-150">
        <svg class="w-4 h-4 text-[#86efac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
        <span>Kiosk View</span>
        <svg class="w-3.5 h-3.5 text-gray-300 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
      </a>
    </nav>

    <!-- RIGHT: Clock & Room Info -->
    <div class="flex items-center space-x-5">
      <div class="h-8 w-[1px] bg-[#166534]"></div>
      <div class="text-right">
        <div id="live-clock" class="text-base font-black text-white tracking-wider leading-none mb-1">
          --:-- --
        </div>
        <div class="text-[10px] font-bold tracking-wider text-[#86efac] uppercase">
          TEACHER STATION • ROOM 176
        </div>
      </div>
    </div>

  </header>

  <!-- ==================== MAIN PAGE CONTENT ==================== -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    
    <!-- View 1: Live Dashboard -->
    <section id="view-dashboard" class="block">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Live Dashboard</h2>
        <p class="text-gray-600">Active classroom monitoring and status overview will appear here.</p>
      </div>
    </section>

    <!-- View 2: Manage Roster -->
    <section id="view-roster" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Manage Roster</h2>
        <p class="text-gray-600">Student roster management tools and settings will appear here.</p>
      </div>
    </section>

  </main>

  <!-- JavaScript Integration -->
  <script src="teacher.js"></script>
</body>
</html>
